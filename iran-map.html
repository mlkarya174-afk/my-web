<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقشه ایران</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: Tahoma, Vazir, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #f1f5f9;
  }
  h1 {
    margin-bottom: 30px;
    font-size: 1.8rem;
  }
  button {
    padding: 18px 40px;
    font-size: 1.2rem;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #059669, #10b981);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(16,185,129,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(16,185,129,0.55);
  }
  button:active {
    transform: translateY(0px) scale(0.98);
  }
  #mapContainer {
    display: none;
    margin-top: 30px;
    width: 90vw;
    max-width: 900px;
    height: 500px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #mapContainer iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
  <h1>🇮🇷 نمایش نقشه ایران</h1>
  <button id="showMapBtn" onclick="showMap()">نمایش نقشه ایران</button>

  <div id="mapContainer">
    <iframe
      src="https://www.google.com/maps?q=Iran&output=embed"
      loading="lazy"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    function showMap() {
      const container = document.getElementById('mapContainer');
      const btn = document.getElementById('showMapBtn');
      container.style.display = 'block';
      btn.style.display = 'none';
    }
  </script>
</body>
</html>
